baseurl = "https://www.rasikjain.com"
title = "Rasik Jain - Senior Architect | Generative AI & Full-Stack Engineering"

theme = "hugo-coder"

languagecode = "en"
defaultcontentlanguage = "en"

paginate = 20
canonifyurls = true

pygmentsstyle = "solarized-dark"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

disqusShortname = ""

googleAnalytics = "UA-8667481-1"
enableRobotsTXT = false


[params]
    description = "Rasik Jain — Architect specializing in Generative AI and Full-Stack engineering. Expert in building Agentic RAG pipelines and intelligent applications using LangChain, Python, React and JavaScript."    
    keywords = "Generative AI, Agentic RAG, AI Agents, LangChain, LangGraph, LLMs, OpenAI, Gemini, Python, ReactJS, TypeScript, AI Architect, Solution Architect, AWS, Azure, Cloud, Vector Databases, ChromaDB, Pinecone, MLOps, Scalable AI, Consulting."
    avatarurl = "images/avatar_rasik.jpg"
    #gravatar = "jainrasik@gmail.com"
    footercontent = ""
    hometitle = "Rasik Jain - Senior Architect | Generative AI & Full-Stack Engineering | AI Agents | Agentic RAG | Full-Stack | Python | React | Node.js | TypeScript | Cloud (AWS, Azure)"
    headertitle = "Rasik Jain"

    dateformat = "January 2, 2006"

    hideFooter = false
    hideCredits = false
    hideCopyright = false
    since = 2018

    # Google Analytics 4
    googleAnalyticsID = "G-821HSLZZ5Y"

    # Git Commit in Footer, uncomment the line below to enable it.
    # commit = "https://github.com/luizdepra/hugo-coder/tree/"

    rtl = false

    # Specify light/dark colorscheme
    # Supported values:
    # "auto" (use preference set by browser)
    # "dark" (dark background, light foreground)
    # "light" (light background, dark foreground) (default)
    colorscheme = "light"

    # Series see also post count
    maxSeeAlsoItems = 20

    # Enable 

    enableTwemoji = true

    # Custom CSS
    custom_css = []

    # Custom JS
    custom_js = []

